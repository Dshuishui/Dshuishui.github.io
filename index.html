var timeZoneOffsetHours = Math.abs(timeZoneOffset / 60);
var timeZoneOffsetMinutes = Math.abs(timeZoneOffset % 60);
var timeZoneOffsetSign = timeZoneOffset > 0 ? "-" : "+";
var formattedTime = xingqi + " " + monthName + " " + day + " " + hours + ":" + minutes + ":" + seconds + " " + "CST"+ " " + year;
// timeZoneOffsetSign + addLeadingZero(timeZoneOffsetHours) + ":" + addLeadingZero(timeZoneOffsetMinutes) 
// console.log(formattedTime);
var timeParagraph = document.getElementById("time");
    timeParagraph.innerHTML = formattedTime;

function addLeadingZero(number) {
  return (number < 10 ? "0" : "") + number;
}
